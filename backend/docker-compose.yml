# Local development stack (docs/DEPLOYMENT.md → Local Services).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: agrowai
      POSTGRES_PASSWORD: agrowai
      POSTGRES_DB: agrowai
    ports:
      - "5432:5432"
    volumes:
      - agrowai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrowai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/code

  worker:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.worker.WorkerSettings
    volumes:
      - ./:/code

volumes:
  agrowai_pgdata:
