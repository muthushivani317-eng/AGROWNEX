services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    env_file:
      - ${AGROWAI_ENV_FILE:-.env.production}
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${MODEL_ARTIFACT_HOST_DIR:?set MODEL_ARTIFACT_HOST_DIR}:/models/mobilenetv3_small_v1:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/ready"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    env_file:
      - ${AGROWAI_ENV_FILE:-.env.production}
    command: ["arq", "app.worker.WorkerSettings"]
    volumes:
      - ${MODEL_ARTIFACT_HOST_DIR:?set MODEL_ARTIFACT_HOST_DIR}:/models/mobilenetv3_small_v1:ro
