name: Security gates

# Blocks merges that add leaked secrets, vulnerable dependencies, unsafe code
# patterns, unauthenticated API routes or website CSP drift. Also runs weekly
# so newly published CVEs are caught even without code changes.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 21 * * 0"   # Mondays 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar xzf gl.tgz gitleaks
      - name: Scan
        run: ./gitleaks git . --redact --no-banner --config .gitleaks.toml

  python-deps:
    name: Backend dependency CVEs (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r requirements.txt
      - name: Audit installed environment
        run: pip-audit --progress-spinner off --skip-editable

  python-sast:
    name: Backend SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: Medium+ severity, medium+ confidence must be zero
        run: bandit -q -r backend/app -ll -ii

  api-auth:
    name: Every API route authenticated
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Route inventory + admin MFA + purge ownership tests
        run: >
          pytest -q tests/test_security_route_inventory.py tests/test_admin_web_security.py
          tests/test_account_purge.py tests/test_csv_safety.py

  node-deps:
    name: App & admin dependency CVEs (npm audit)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [agrow-ai, admin-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit shipped dependencies
        working-directory: ${{ matrix.project }}
        run: npm audit --omit=dev --json | python3 ../scripts/ci/npm_audit_gate.py

  website-csp:
    name: Website CSP covers inline code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 website/check_csp.py
