name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (ruff · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy pytest-cov
      - name: Lint (ruff)
        run: ruff check app
      - name: Type check (mypy, gradual)
        run: mypy app || true   # gradual typing: report, do not block yet
      - name: Verify controlled-pilot model inventory
        run: python -m scripts.verify_model_inventory
      - name: Tests + coverage gate
        run: pytest tests -q --cov=app --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Mobile (tsc · jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agrow-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npx jest --ci
